services:
  - type: web
    name: reelrag-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GOOGLE_API_KEY
        sync: true
      - key: WEAVIATE_URL
        sync: true
      - key: WEAVIATE_API_KEY
        sync: true
      - key: SUPABASE_URL
        sync: true
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: true
      - key: SUPABASE_JWT_SECRET
        sync: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: true
